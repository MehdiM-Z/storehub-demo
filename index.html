<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoreHub Demo</title>
    <style>
        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background: #f4f6fb;
            color: #222;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 25px #0001;
        }
        h1 { color: #2563eb; }
        p { line-height: 2; }
        .success {
            display: inline-block;
            padding: 10px 20px;
            background: #dcfce7;
            color: #15803d;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>StoreHub 🚀</h1>
        <h2>اولین تست موفق شد!</h2>
        <p>فروشگاه نمایشی StoreHub به اینترنت متصل شده است.</p>
        <div class="success">GitHub Pages آماده است</div>
    </div>
</body>
</html>
